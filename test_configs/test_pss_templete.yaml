
dataroot: "./datasets/mri"
name: "css_diff"
checkpoints_dir: "./checkpoints"
gpu_ids: "0"
results_dir: "./results"
epoch: latest
model: "pss_lsc_sgp"
netG: "unest"
dataset_mode: "aligned"
input_nc: 1
output_nc: 1

phase: "test"
lambda_L1: 100.0
batch_size: 1
load_size: 224
preprocess: "resize"
n_epochs: 10
n_epochs_decay: 10
save_epoch_freq: 1
continue_train: false
display_id: -1

PSS:
  path: null
  image_size: 224
  model:
    type: "simple"
    in_channels: 2
    out_ch: 1
    ch: 128
    ch_mult: [1, 2, 2, 2, 4]
    num_res_blocks: 2
    attn_resolutions: [16, ]
    dropout: 0.1
    var_type: fixedlarge
    ema_rate: 0.9999
    ema: True
    resamp_with_conv: True

  diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 50

  training:
    batch_size: 128
    n_epochs: 10000
    n_iters: 5000000
    snapshot_freq: 5000
    validation_freq: 20000

  sampling:
    batch_size: 32
    last_only: True

  optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.0004
    beta1: 0.9
    amsgrad: false
    eps: 0.00000001
    grad_clip: 1.0

sgp_weights: "./weights/clip_1.pth"
lsc_weights: "./weights/unet_weights_rotate.pth"
LSC_mask: 0.2
LSC_patch: 24
